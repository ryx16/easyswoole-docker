name: Build Base Alpine Images for EasySwoole

on:
  push:
    branches:
      - 'main'

jobs:
  build_base_alpine_images:
    runs-on: ubuntu-22.04
    if: github.repository == 'ryx16/easyswoole-docker'
    name: The Base Alpine Image For EasySwoole
    strategy:
      matrix:
        include:
          - php-prefix: "8"
            php: "8.3.36"
            alpine: "3.24"
          - php-prefix: "8"
            php: "8.4.27"
            alpine: "3.24"
          - php-prefix: "8"
            php: "8.5.12"
            alpine: "3.24"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image ryx16/php:${{ matrix.php }}-alpine${{ matrix.alpine }}-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/php${{ matrix.php-prefix }}/${{ matrix.php }}/alpine/${{ matrix.alpine }}/base/Dockerfile
          platforms: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/s390x
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ryx16/php:${{ matrix.php }}-alpine${{ matrix.alpine }}-base
