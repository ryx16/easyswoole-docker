name: Build Versioned Alpine Images for EasySwoole PHP 8.5

on:
  push:
    branches:
      - 'main'

jobs:
  build_versioned_alpine_images:
    runs-on: ubuntu-22.04
    if: github.repository == 'ryx16/easyswoole-docker'
    strategy:
      matrix:
        include:
          - php: 8.5.12
            alpine: 3.24
            swoole: "6.2.2"

    name: The Alpine Image For EasySwoole PHP-${{ matrix.php }} Swoole-${{ matrix.swoole }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image ryx16/easyswoole:php${{ matrix.php }}-alpine${{ matrix.alpine }}-swoole${{ matrix.swoole }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/php8/${{ matrix.php }}/alpine/${{ matrix.alpine }}/swoole/${{ matrix.swoole }}/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ryx16/easyswoole:php${{ matrix.php }}-alpine${{ matrix.alpine }}-swoole${{ matrix.swoole }}
